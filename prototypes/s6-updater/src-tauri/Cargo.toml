[package]
name = "q55-updater"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tauri = { version = "=2.12.7", features = [] }
tauri-plugin-updater = "=2.14.1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 1
