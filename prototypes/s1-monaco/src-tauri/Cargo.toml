[package]
name = "diffy-s1-monaco"
version = "0.0.0"
description = "Throwaway S1 prototype for map question Q41. Never merged."
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "diffy_s1_monaco_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Q42 only: the WebKitGTK snapshot, the GPU report and the PNG files.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"
gio = "0.18"
javascriptcore-rs = "=1.1.2"
cairo-rs = { version = "0.18", features = ["png"] }

[profile.release]
debug = "line-tables-only"
