[workspace]
resolver = "3"
members = [
    "apps/desktop",
    "crates/diffy-core",
    "crates/diffy-comparison",
    "crates/diffy-git",
    "crates/diffy-review",
    "crates/diffy-providers",
    "crates/diffy-storage",
    "crates/gix-imara-diff",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
