[package]
name = "diffy-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
diffy-core = { path = "../../crates/diffy-core" }
diffy-comparison = { path = "../../crates/diffy-comparison" }
diffy-git = { path = "../../crates/diffy-git" }
diffy-review = { path = "../../crates/diffy-review" }
diffy-providers = { path = "../../crates/diffy-providers" }
diffy-storage = { path = "../../crates/diffy-storage" }
tauri = "2.12.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
encoding_rs = "0.8.44"
tauri-plugin-single-instance = "2.5.5"
rusqlite = "0.43"

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
tauri-build = "2"
